[package]
name = "swiftget"
version = "1.0.0"
description = "SwiftGet - fast, open-source multi-connection download manager for Windows"
authors = ["Shubrato Debnath <shubratodn44985@gmail.com>"]
license = "MIT"
repository = "https://github.com/ShubratoDn/idm-clone-swiftget"
homepage = "https://github.com/ShubratoDn/idm-clone-swiftget"
readme = "../README.md"
keywords = ["download-manager", "downloader", "accelerator", "tauri", "hls"]
categories = ["network-programming"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
# HTTP/1.1 only on purpose: every segment must get its own TCP connection.
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "charset", "stream"] }
futures-util = "0.3"
percent-encoding = "2"
chrono = "0.4"
tiny_http = "0.12"
arboard = "3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
